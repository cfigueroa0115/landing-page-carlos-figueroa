<section
  id="skills"
  class="section skills-section"
  appInView
  [threshold]="0.15"
  (inView)="onVisibilityChange($event)"
  [class.is-visible]="isVisible()"
  aria-labelledby="skills-heading"
>
  <div class="container">
    <h2 id="skills-heading" class="skills-heading">Capacidades y tecnologías</h2>

    <div class="skills-grid">
      @for (category of categories; track category.title) {
        <article class="skill-category">
          <h3 class="skill-category__title">{{ category.title }}</h3>
          <div class="skill-category__tags">
            @for (tag of category.tags; track tag) {
              <span class="skill-tag">{{ tag }}</span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
