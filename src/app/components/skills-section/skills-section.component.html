<section
  id="skills"
  class="section skills-section"
  appInView
  [threshold]="0.15"
  (inView)="onVisibilityChange($event)"
  [class.is-visible]="isVisible()"
  aria-labelledby="skills-heading"
>
  <app-section-background variant="capabilities" [height]="700"></app-section-background>

  <div class="container">
    <div class="skills-header">
      <span class="section-eyebrow">CAPACIDADES</span>
      <h2 id="skills-heading" class="section-title">Conocimiento técnico conectado con visión de negocio</h2>
    </div>

    <div class="skills-grid">
      @for (category of categories; track category.title; let i = $index) {
        <article
          class="skill-card"
          [class.skill-card--active]="activeCategory() === i"
          [class.skill-card--dimmed]="activeCategory() !== -1 && activeCategory() !== i"
          [attr.data-accent]="category.accentColor"
          [style.--card-delay]="i + 's'"
          (mouseenter)="setActiveCategory(i)"
          (mouseleave)="clearActiveCategory()"
          (focus)="setActiveCategory(i)"
          (blur)="clearActiveCategory()"
          tabindex="0"
          [attr.aria-label]="'Dominio: ' + category.title"
        >
          <div class="skill-card__border-anim" aria-hidden="true"></div>

          <div class="skill-card__header">
            <div class="skill-card__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                @for (path of getIconPaths(category.icon); track path) {
                  <path [attr.d]="path"/>
                }
              </svg>
            </div>
            <div class="skill-card__title-group">
              <h3 class="skill-card__title">{{ category.title }}</h3>
              <p class="skill-card__description">{{ category.description }}</p>
            </div>
          </div>
          <div class="skill-card__tags" role="list" aria-label="Competencias del dominio">
            @for (tag of category.tags; track tag) {
              <span class="skill-tag" role="listitem">{{ tag }}</span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
