<section
  id="skills"
  class="section skills-section"
  appInView
  [threshold]="0.15"
  (inView)="onVisibilityChange($event)"
  [class.is-visible]="isVisible()"
  aria-labelledby="skills-heading"
>
  <div class="container">
    <!-- Section Heading -->
    <h2 id="skills-heading" class="text-gradient section-heading">Competencias y Tecnologías</h2>

    <!-- Category Grid -->
    <div class="categories-grid">
      <div
        *ngFor="let category of categories; let i = index"
        class="category-card"
        [style.animation-delay]="(i * 0.15) + 's'"
      >
        <div class="category-header">
          <span class="category-icon" [attr.aria-hidden]="true">
            <ng-container [ngSwitch]="category.icon">
              <svg *ngSwitchCase="'rocket'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
              <svg *ngSwitchCase="'settings'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngSwitchCase="'cpu'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
              <svg *ngSwitchCase="'layers'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
            </ng-container>
          </span>
          <h3 class="category-title">{{ category.title }}</h3>
        </div>
        <ul class="category-tags" [attr.aria-label]="'Habilidades en ' + category.title">
          <li
            *ngFor="let tag of category.tags; let j = index"
            class="skill-tag"
            [style.animation-delay]="((i * 0.15) + (j * 0.08)) + 's'"
          >
            {{ tag }}
          </li>
        </ul>
      </div>
    </div>

    <!-- Skill Bars -->
    <div class="skill-bars-container">
      <h3 class="skill-bars-heading">Competencias Clave</h3>
      <div class="skill-bars-grid">
        <div
          *ngFor="let skill of skillBars; let k = index"
          class="skill-bar-item"
          [style.animation-delay]="(k * 0.12) + 's'"
        >
          <div class="skill-bar-header">
            <span class="skill-bar-label">{{ skill.label }}</span>
            <span class="skill-bar-percentage">{{ skill.percentage }}%</span>
          </div>
          <div class="skill-bar-track" role="progressbar"
            [attr.aria-valuenow]="skill.percentage"
            [attr.aria-valuemin]="0"
            [attr.aria-valuemax]="100"
            [attr.aria-label]="skill.label + ': ' + skill.percentage + '%'"
          >
            <div
              class="skill-bar-fill"
              [style.--target-width]="skill.percentage + '%'"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
