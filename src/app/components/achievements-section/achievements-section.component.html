<section
  id="achievements"
  class="section achievements-section"
  appInView
  [threshold]="0.2"
  (inView)="onVisibilityChange($event)"
  [class.is-visible]="isVisible()"
  aria-labelledby="achievements-heading"
>
  <div class="container">
    <h2 id="achievements-heading" class="achievements-heading">Impacto profesional</h2>

    <div class="achievements-grid" role="list" aria-label="Logros profesionales">
      @for (achievement of achievements; track achievement.title) {
        <article class="achievement-card" role="listitem">
          <span class="achievement-percentage">{{ achievement.percentage }}%</span>
          <h3 class="achievement-title">{{ achievement.title }}</h3>
          <p class="achievement-description">{{ achievement.description }}</p>
          <span class="achievement-company">{{ achievement.company }}</span>
        </article>
      }
    </div>
  </div>
</section>
