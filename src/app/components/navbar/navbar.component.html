<nav
  class="navbar"
  [class.navbar--scrolled]="isScrolled()"
  role="navigation"
  aria-label="Navegación principal"
>
  <div class="navbar__container">
    <!-- Logo -->
    <a
      class="navbar__logo"
      href="#hero"
      (click)="$event.preventDefault(); navigateToSection('hero')"
      aria-label="Ir al inicio"
    >
      <svg class="navbar__logo-icon" xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <!-- CF Monogram — Premium Executive v2 -->
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#16A6C7"/>
            <stop offset="100%" stop-color="#146C94"/>
          </linearGradient>
          <linearGradient id="logoGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7DEBFF" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#16A6C7" stop-opacity="0.3"/>
          </linearGradient>
        </defs>
        <!-- Outer rounded square frame -->
        <rect x="3" y="3" width="42" height="42" rx="12" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
        <!-- Inner accent line (subtle depth) -->
        <rect x="6" y="6" width="36" height="36" rx="9" stroke="url(#logoGradLight)" stroke-width="0.7" fill="none"/>
        <!-- Letter C: elegant open arc -->
        <path d="M23 14C20.5 14 18.5 15 17 16.8C15.5 18.6 14.8 21 14.8 24C14.8 27 15.5 29.4 17 31.2C18.5 33 20.5 34 23 34" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Letter F: clean vertical + two horizontals -->
        <path d="M27 14V34" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M27 14H34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M27 23H32" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <!-- Top-right accent dot (innovation/excellence) -->
        <circle cx="37" cy="11" r="2.2" fill="url(#logoGrad)"/>
      </svg>
    </a>

    <!-- Desktop Navigation Links -->
    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.sectionId) {
        <li>
          <a
            class="navbar__link"
            [class.navbar__link--active]="activeSection() === link.sectionId"
            [href]="'#' + link.sectionId"
            (click)="$event.preventDefault(); navigateToSection(link.sectionId)"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Desktop CTA -->
    <div class="navbar__ctas">
      <button
        type="button"
        class="navbar__download-btn"
        (click)="downloadCV()"
        aria-label="Descargar currículum en formato PDF"
      >
        Descargar CV
      </button>
    </div>

    <!-- Mobile Hamburger Button -->
    <button
      class="hamburger-btn"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
@if (isMobileMenuOpen()) {
  <div
    class="mobile-overlay"
    id="mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación móvil"
  >
    <div class="mobile-nav-content">
      <button
        class="mobile-nav-content__close"
        type="button"
        (click)="closeMobileMenu()"
        aria-label="Cerrar menú de navegación"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>

      <ul class="mobile-nav-content__links" role="list">
        @for (link of navLinks; track link.sectionId) {
          <li>
            <a
              class="mobile-nav-content__link"
              [class.mobile-nav-content__link--active]="activeSection() === link.sectionId"
              [href]="'#' + link.sectionId"
              (click)="$event.preventDefault(); navigateToSection(link.sectionId)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <button
        type="button"
        class="mobile-nav-content__download"
        (click)="downloadCV(); closeMobileMenu()"
        aria-label="Descargar currículum"
      >
        Descargar CV
      </button>
    </div>
  </div>
}
