<nav
  class="navbar"
  [class.navbar--scrolled]="isScrolled()"
  role="navigation"
  aria-label="Navegación principal"
>
  <div class="navbar__container">
    <!-- Logo -->
    <a
      class="navbar__logo"
      href="#hero"
      (click)="$event.preventDefault(); navigateToSection('hero')"
      aria-label="Ir al inicio"
    >
      <svg class="navbar__logo-icon" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <!-- CF Monogram — Premium Executive Brand -->
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#16A6C7"/>
            <stop offset="100%" stop-color="#146C94"/>
          </linearGradient>
        </defs>
        <!-- Outer frame: rounded hexagonal shape (strategy/structure) -->
        <path d="M20 3L33.5 10.5V25.5L20 33L6.5 25.5V10.5Z" stroke="url(#logoGrad)" stroke-width="1.8" fill="none" opacity="0.9"/>
        <!-- C letter: bold arc representing continuity and transformation -->
        <path d="M22 12.5C20.5 11.2 18.5 10.8 16.5 11.5C13.5 12.5 12 15.5 12 20C12 24.5 13.5 27.5 16.5 28.5C18.5 29.2 20.5 28.8 22 27.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <!-- F letter: geometric forward/progress strokes -->
        <path d="M24 12V28" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M24 12H30" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M24 19.5H28.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <!-- Accent node: innovation spark -->
        <circle cx="31.5" cy="12" r="1.8" fill="url(#logoGrad)"/>
      </svg>
    </a>

    <!-- Desktop Navigation Links -->
    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.sectionId) {
        <li>
          <a
            class="navbar__link"
            [class.navbar__link--active]="activeSection() === link.sectionId"
            [href]="'#' + link.sectionId"
            (click)="$event.preventDefault(); navigateToSection(link.sectionId)"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Desktop CTA -->
    <div class="navbar__ctas">
      <button
        type="button"
        class="navbar__download-btn"
        (click)="downloadCV()"
        aria-label="Descargar currículum en formato PDF"
      >
        Descargar CV
      </button>
    </div>

    <!-- Mobile Hamburger Button -->
    <button
      class="hamburger-btn"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
@if (isMobileMenuOpen()) {
  <div
    class="mobile-overlay"
    id="mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación móvil"
  >
    <div class="mobile-nav-content">
      <button
        class="mobile-nav-content__close"
        type="button"
        (click)="closeMobileMenu()"
        aria-label="Cerrar menú de navegación"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>

      <ul class="mobile-nav-content__links" role="list">
        @for (link of navLinks; track link.sectionId) {
          <li>
            <a
              class="mobile-nav-content__link"
              [class.mobile-nav-content__link--active]="activeSection() === link.sectionId"
              [href]="'#' + link.sectionId"
              (click)="$event.preventDefault(); navigateToSection(link.sectionId)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <button
        type="button"
        class="mobile-nav-content__download"
        (click)="downloadCV(); closeMobileMenu()"
        aria-label="Descargar currículum"
      >
        Descargar CV
      </button>
    </div>
  </div>
}
