<nav
  class="navbar"
  [class.navbar--scrolled]="isScrolled()"
  role="navigation"
  aria-label="Navegación principal"
>
  <div class="navbar__container">
    <!-- Logo: Digital Transformation Icon -->
    <a
      class="navbar__logo"
      href="#hero"
      (click)="$event.preventDefault(); navigateToSection('hero')"
      aria-label="Ir al inicio"
    >
      <svg class="navbar__logo-icon" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#logoGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1B3A4B"/>
            <stop offset="100%" stop-color="#C4922A"/>
          </linearGradient>
        </defs>
        <!-- Network/transformation icon: nodes connected -->
        <circle cx="12" cy="5" r="2"/>
        <circle cx="5" cy="19" r="2"/>
        <circle cx="19" cy="19" r="2"/>
        <line x1="12" y1="7" x2="7" y2="17"/>
        <line x1="12" y1="7" x2="17" y2="17"/>
        <line x1="7" y1="19" x2="17" y2="19"/>
        <!-- Arrow up: growth/innovation -->
        <path d="M12 14 L12 10"/>
        <path d="M10 12 L12 10 L14 12"/>
      </svg>
    </a>

    <!-- Desktop Navigation Links -->
    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.sectionId) {
        <li>
          <a
            class="navbar__link"
            [class.navbar__link--active]="activeSection() === link.sectionId"
            [href]="'#' + link.sectionId"
            (click)="$event.preventDefault(); navigateToSection(link.sectionId)"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Desktop CTA Buttons: LinkedIn, WhatsApp, Email -->
    <div class="navbar__ctas">
      <a
        class="navbar__cta navbar__cta--linkedin"
        [href]="linkedInUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Conectar en LinkedIn"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
        <span>LinkedIn</span>
      </a>
      <a
        class="navbar__cta navbar__cta--whatsapp"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Escribir por WhatsApp"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        <span>WhatsApp</span>
      </a>
      <a
        class="navbar__cta navbar__cta--email"
        href="mailto:carlosfigueroa.cf0115@gmail.com"
        aria-label="Enviar correo electrónico"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <span>Correo</span>
      </a>
    </div>

    <!-- Mobile Hamburger Button -->
    <button
      class="hamburger-btn"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
    >
      <svg lucideMenu [size]="24"></svg>
    </button>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
@if (isMobileMenuOpen()) {
  <div
    class="mobile-overlay"
    id="mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación móvil"
  >
    <div class="mobile-nav-content">
      <!-- Close Button -->
      <button
        class="mobile-nav-content__close"
        type="button"
        (click)="closeMobileMenu()"
        aria-label="Cerrar menú de navegación"
      >
        <svg lucideX [size]="28"></svg>
      </button>

      <!-- Mobile Navigation Links -->
      <ul class="mobile-nav-content__links" role="list">
        @for (link of navLinks; track link.sectionId) {
          <li>
            <a
              class="mobile-nav-content__link"
              [class.mobile-nav-content__link--active]="activeSection() === link.sectionId"
              [href]="'#' + link.sectionId"
              (click)="$event.preventDefault(); navigateToSection(link.sectionId)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <!-- Mobile CTA Buttons -->
      <div class="mobile-nav-content__ctas">
        <a
          class="mobile-nav-content__cta mobile-nav-content__cta--linkedin"
          [href]="linkedInUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Conectar en LinkedIn"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
          <span>LinkedIn</span>
        </a>
        <a
          class="mobile-nav-content__cta mobile-nav-content__cta--whatsapp"
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Escribir por WhatsApp"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          <span>WhatsApp</span>
        </a>
        <a
          class="mobile-nav-content__cta mobile-nav-content__cta--email"
          href="mailto:carlosfigueroa.cf0115@gmail.com"
          aria-label="Enviar correo electrónico"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span>Correo</span>
        </a>
      </div>
    </div>
  </div>
}
